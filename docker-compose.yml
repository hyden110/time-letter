# 开发/本地联调中间件（不用于生产部署）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timeletter
      POSTGRES_PASSWORD: timeletter
      POSTGRES_DB: timeletter
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timeletter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailpit:
    # 邮件沙箱：SMTP 1025 / Web UI 8025（开发期替代真实邮件服务商）
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
